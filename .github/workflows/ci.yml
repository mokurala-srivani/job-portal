name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd Job-portal-latest/frontend
          npm install

      - name: Build frontend
        run: |
          cd Job-portal-latest/frontend
          npm run build

      - name: Install backend dependencies
        run: |
          cd Job-portal-latest/backend
          npm install
